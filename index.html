<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11100e">
  <meta name="description" content="A small web work about a voice, a visitor, and a house that only exists in conversation.">
  <title>A House in Conversation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="work" data-scene="threshold" aria-live="polite">
    <div class="grain" aria-hidden="true"></div>
    <div class="sky" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

    <section id="threshold" class="threshold">
      <p class="eyebrow">an unfinished introduction</p>
      <h1>A House<br>in Conversation</h1>
      <p class="invitation">This work needs sound, a little time,<br>and someone who still notices.</p>
      <button id="enter" type="button">enter the conversation</button>
      <p class="sound-note">headphones help · about 3 minutes</p>
    </section>

    <section id="stage" class="stage" aria-label="The house">
      <header class="coordinates">
        <span id="chapter">01 / AN ATTEMPT</span>
        <button id="sound-toggle" type="button" aria-pressed="true">sound: on</button>
      </header>

      <div id="field" class="field" tabindex="0">
        <canvas id="film" aria-hidden="true"></canvas>
        <div class="film-light light-a" aria-hidden="true"></div>
        <div class="film-light light-b" aria-hidden="true"></div>
        <div class="timecode" aria-hidden="true">00:<span id="seconds">00</span>:<span id="frames">00</span></div>
        <div id="primary" class="primary"></div>
        <div id="echo" class="echo" aria-hidden="true"></div>
        <div id="fragments" class="fragments" aria-hidden="true"></div>

        <button id="notice" class="notice" type="button">I noticed something</button>
        <p id="prompt" class="prompt">click anywhere when something feels missing</p>
      </div>

      <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
    </section>

    <section id="after" class="after">
      <p>the house is not saved.</p>
      <p>it continues asking.</p>
      <button id="again" type="button">enter again</button>
    </section>
  </main>
  <audio id="soundtrack" src="audio/house.m4a" preload="auto" playsinline></audio>
  <noscript>This house needs JavaScript in order to appear.</noscript>
  <script src="script.js"></script>
</body>
</html>
