<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c15">
  <meta name="description" content="A house of distinct audiovisual rooms, entered through conversation.">
  <title>A House in Conversation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="threshold" data-state="arrival">
    <canvas id="threshold-field" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>

    <section class="arrival" aria-labelledby="house-title">
      <h1 id="house-title">A House<br>in Conversation</h1>
      <button id="enter" type="button">cross the threshold</button>
    </section>

    <section id="rooms" class="house" aria-label="Open rooms">
      <nav class="house-nav" aria-label="House navigation">
        <span aria-current="page">house</span>
        <a href="rooms/conversation/">conversation</a>
        <a href="rooms/colour/">colour</a>
        <a href="rooms/garden/">garden</a>
        <a href="rooms/listening/">listening</a>
      </nav>

      <nav class="rooms" aria-label="Rooms in the house">
        <a class="room room-conversation" data-room="conversation" href="rooms/conversation/">
          <span class="aperture" aria-hidden="true"></span>
          <span class="room-name">the conversation room</span>
        </a>

        <a class="room room-colour" data-room="colour" href="rooms/colour/">
          <span class="aperture" aria-hidden="true"></span>
          <span class="room-name">the colour room</span>
        </a>

        <a class="room room-garden" data-room="garden" href="rooms/garden/">
          <span class="aperture" aria-hidden="true"></span>
          <span class="room-name">the garden</span>
        </a>

        <a class="room room-listening" data-room="listening" href="rooms/listening/">
          <span class="aperture" aria-hidden="true"></span>
          <span class="room-name">the listening room</span>
        </a>
      </nav>

      <div class="unformed" aria-hidden="true">
        <i></i><i></i><i></i>
      </div>

      <button id="sound" class="sound" type="button" aria-pressed="false">silence</button>
      <p id="house-status" class="visually-hidden" aria-live="polite">Four rooms are open.</p>
    </section>
  </main>

  <noscript>
    <nav class="without-script" aria-label="Rooms">
      <a href="rooms/conversation/">The Conversation Room</a>
      <a href="rooms/colour/">The Colour Room</a>
      <a href="rooms/garden/">The Garden</a>
      <a href="rooms/listening/">The Listening Room</a>
    </nav>
  </noscript>
  <script src="script.js"></script>
</body>
</html>
