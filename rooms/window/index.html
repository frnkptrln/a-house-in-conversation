<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07121d">
  <meta name="description" content="The Window — an intentionally silent room for movement, stillness, and distance inside A House in Conversation.">
  <title>The Window — A House in Conversation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-room-state="threshold">
  <nav class="house-nav" aria-label="House navigation">
    <a href="../../#rooms">house</a>
    <a href="../conversation/">conversation</a>
    <a href="../colour/">colour</a>
    <a href="../garden/">garden</a>
    <a href="../listening/">listening</a>
    <a href="../afterimage/">afterimage</a>
    <span aria-current="page">window</span>
    <a href="../machine/">machine</a>
    <a href="../archive/">archive</a>
  </nav>

  <main id="room" data-state="threshold" data-view="distance" data-instruction="move">
    <section class="threshold" aria-labelledby="window-title">
      <div class="threshold-light" aria-hidden="true"></div>
      <div class="threshold-copy">
        <p class="silence">this room is silent</p>
        <h1 id="window-title">the<br>window</h1>
        <p class="window-rule">movement finds the glass<br>stillness lets it disappear</p>
        <button id="enter" type="button">look out</button>
      </div>
    </section>

    <section class="performance" aria-label="A silent view through glass">
      <canvas
        id="window-field"
        tabindex="0"
        aria-label="A silent view through glass. Move a pointer or finger to reveal the glass; stop moving to let the distance become clear. Arrow keys also move the view."
      ></canvas>
      <p class="instruction" aria-hidden="true">
        <span>move across the glass</span>
        <span>then let it rest</span>
      </p>
      <p id="window-status" class="visually-hidden" aria-live="polite">The glass is near.</p>
      <a class="return" href="../../#rooms">return to the rooms</a>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
