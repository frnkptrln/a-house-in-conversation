<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3eadf">
  <meta name="description" content="The Colour Room — an interactive audiovisual room inside A House in Conversation.">
  <title>The Colour Room</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="room" data-state="threshold">
    <section id="threshold" class="threshold">
      <h1>bring two<br>colours together</h1>
      <button id="enter" type="button">enter</button>
    </section>

    <section id="performance" class="performance" aria-label="Interactive colour performance">
      <canvas id="colour-field"></canvas>
      <button id="sound-fallback" class="sound-fallback" type="button" hidden>tap for sound</button>
    </section>

    <section id="ending" class="ending">
      <p>neither contained this</p>
      <button id="again" type="button">again</button>
    </section>
  </main>

  <audio id="soundtrack" src="audio/colour.m4a" preload="auto" playsinline></audio>
  <script src="script.js"></script>
</body>
</html>
